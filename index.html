<style>
:root{--red:#e8262d;--red2:#ff3b3b;--txt:#fff;--mut:#c9bcbc;--line:rgba(232,38,45,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0304;overscroll-behavior:none}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--txt);overflow:hidden}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;
 background:radial-gradient(ellipse at 50% 22%,#3b0a0d 0%,#1a0507 48%,#0b0304 100%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);
 overflow-y:auto;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;opacity:0;transform:translateX(40px);pointer-events:none}
.screen.on{opacity:1;transform:none;pointer-events:auto}
.screen.left{transform:translateX(-40px)}
/* splash */
#splash{align-items:center;justify-content:center;z-index:5;background:#0b0304;transition:opacity .5s}
#splash .logo{width:180px;animation-fill-mode:both;border-radius:50%;will-change:transform,rotate;backface-visibility:hidden;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both, spin 1.4s .1s ease-out both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{from{rotate:-180deg}to{rotate:0deg}}
/* welcome */



@media (min-width:438px){}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:clamp(8px,5vh,56px)}
.hero .logo{width:min(200px,50vw,26vh);filter:drop-shadow(0 0 22px rgba(232,38,45,.55)) drop-shadow(0 8px 14px rgba(0,0,0,.8))}
.title{font-family:'Margarine',Impact,sans-serif;font-size:clamp(58px,19vw,84px);line-height:.95;color:#ee2b31;margin-top:-10px;transform:rotate(-5deg);letter-spacing:1px;text-shadow:0 0 22px rgba(232,38,45,.45),0 5px 0 #4a080b,0 10px 18px rgba(0,0,0,.8)}
.tag{margin-top:12px;font-weight:800;letter-spacing:2px;font-size:14px;color:#e6e0e0;transform:rotate(-5deg);text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:20px}
@media (max-height:760px){.item{padding:12px 14px}.item .ic{width:28px;height:28px}.txt small{font-size:11.5px}.hero{margin-top:4px}}
.item{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;cursor:pointer;width:100%;text-align:left;font:inherit;color:#fff;
 background:linear-gradient(180deg,rgba(60,14,16,.75),rgba(20,6,7,.85));border:1px solid var(--line);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px rgba(232,38,45,.12);transition:.15s}
.item:active{transform:scale(.98);border-color:var(--red2);box-shadow:0 0 26px rgba(232,38,45,.4)}
.item .ic{width:32px;height:32px;flex:none}
.txt{flex:1;min-width:0}.txt b{display:block;font-weight:800;font-size:14.5px;letter-spacing:.3px;text-transform:uppercase}
.txt small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.chev{width:12px;opacity:.8;flex:none}
/* inner screens */
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(40,10,12,.7);color:#fff;display:grid;place-items:center;cursor:pointer}
.top h2{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.lead{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;background:rgba(20,6,7,.85);padding:0 14px;margin-bottom:16px;transition:.15s}
.field:focus-within{border-color:var(--red2);box-shadow:0 0 18px rgba(232,38,45,.3)}
.field input,.field select{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:600 16px Montserrat,sans-serif;padding:15px 0}
.field select{flex:none;width:auto;appearance:none;padding-right:4px}
.field select option{background:#1a0507}
.field .sep{width:1px;height:24px;background:var(--line)}
.eye{background:none;border:0;color:var(--mut);font:700 12px Montserrat;cursor:pointer;padding:6px}
.err{color:#ff7a7a;font-size:13px;min-height:18px;margin:-8px 0 12px}
.btn{width:100%;padding:17px;border-radius:14px;border:0;font:800 15px Montserrat,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#fff;cursor:pointer;
 background:linear-gradient(180deg,#ff3b3b,#c3161c);box-shadow:0 8px 24px rgba(232,38,45,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:.15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:none;border:1px solid var(--line);box-shadow:none;margin-top:12px}
.link{background:none;border:0;color:var(--red2);font:700 13px Montserrat;cursor:pointer;margin:4px 0 20px;align-self:flex-end}
.spacer{flex:1;min-height:20px}
.otp{display:flex;gap:8px;justify-content:space-between;margin-bottom:12px}
.otp input{width:100%;aspect-ratio:1/1.15;max-width:56px;text-align:center;font:800 24px Montserrat;color:#fff;border-radius:12px;border:1px solid var(--line);background:rgba(20,6,7,.85);outline:0}
.otp input:focus{border-color:var(--red2);box-shadow:0 0 16px rgba(232,38,45,.35)}
.resend{font-size:13px;color:var(--mut);text-align:center;margin:10px 0}
.resend button{background:none;border:0;color:var(--red2);font:700 13px Montserrat;cursor:pointer}
.lang{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(20,6,7,.85);margin-bottom:10px;cursor:pointer;width:100%;color:#fff;font:600 16px Montserrat;text-align:left}
.lang .flag{font-size:24px}.lang .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.lang.sel{border-color:var(--red2);box-shadow:0 0 18px rgba(232,38,45,.25)}.lang.sel .ck{background:var(--red);border-color:var(--red)}
/* home */

 background:
  radial-gradient(120% 140% at 0% 0%,rgba(200,95,25,.40) 0%,rgba(200,95,25,0) 45%),
  radial-gradient(120% 140% at 100% 0%,rgba(200,95,25,.40) 0%,rgba(200,95,25,0) 45%),
  radial-gradient(120% 140% at 0% 100%,rgba(200,95,25,.40) 0%,rgba(200,95,25,0) 45%),
  radial-gradient(120% 140% at 100% 100%,rgba(200,95,25,.40) 0%,rgba(200,95,25,0) 45%),
  rgba(110,45,8,.30)!important;
 border:1px solid rgba(247,139,68,.42)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.3),0 0 14px rgba(200,95,25,.22),0 6px 18px rgba(0,0,0,.5)!important}
.item:active,.tile:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 22px rgba(247,139,68,.45)!important}
.tab.on{border-color:rgba(247,139,68,.42)!important;background:radial-gradient(120% 140% at 50% 0%,rgba(200,95,25,.5) 0%,rgba(200,95,25,0) 60%),rgba(110,45,8,.35)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 0 14px rgba(200,95,25,.3)!important}
.tabbar{border-top-color:rgba(247,139,68,.25)!important;background:linear-gradient(180deg,rgba(20,8,2,.2),rgba(20,8,2,.92))!important}
.tile svg,.tab.on svg,.soon .big,.pcard .av{color:#F78B44!important}
.soon .big{border-color:rgba(247,139,68,.42)!important;background:rgba(110,45,8,.3)!important}
.txt small,.hello,.soon,.pcard small,.lead,.resend,.bioTxt,label{color:#F0DCCB!important}
.tab{color:#cdb3a0}
.title{color:#F78B44!important;text-shadow:0 0 14px rgba(200,95,25,.35),0 5px 0 #4a1f06,0 10px 18px rgba(0,0,0,.8)!important}
.hero .logo,.hdr .logo{filter:drop-shadow(0 0 12px rgba(200,95,25,.35)) drop-shadow(0 8px 14px rgba(0,0,0,.8))!important}
.btn{background:linear-gradient(180deg,#E57A33,#A44F17)!important;box-shadow:0 6px 18px rgba(160,70,15,.35),inset 0 1px 0 rgba(255,255,255,.2)!important}
.btn.ghost{background:rgba(110,45,8,.3)!important;border:1px solid rgba(247,139,68,.42)!important}
.field,.otp input,.lang,.back{border-color:rgba(247,139,68,.35)!important;background:rgba(15,6,1,.8)!important}
.field:focus-within,.otp input:focus,.lang.sel{border-color:#FF9F5C!important;box-shadow:0 0 16px rgba(247,139,68,.3)!important}
.lang.sel .ck{background:#F78B44!important;border-color:#F78B44!important}
.link,.resend button{color:#FF9F5C!important}
.bio{color:#FF9F5C!important;border-color:rgba(247,139,68,.42)!important;background:radial-gradient(circle,rgba(247,139,68,.18),rgba(15,6,1,.9) 70%)!important;box-shadow:0 0 40px rgba(247,139,68,.25)!important}
.bio .scan{background:#FF9F5C!important;box-shadow:0 0 14px #FF9F5C!important}
.msg{background:rgba(110,45,8,.3)!important;border-color:rgba(247,139,68,.35)!important;color:#FBEDE2!important}
.badge{border-color:rgba(247,139,68,.42)!important;color:#FFC8A0!important}

/* ===== HEROES: Dosis em tudo ===== */
#app *:not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______){font-family:Dosis,sans-serif!important}
#app .brand .sub:not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______){font-weight:800!important;letter-spacing:2px!important}
#app .brand .title:not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______){font-weight:800!important;letter-spacing:3px!important;font-size:clamp(52px,min(19vw,9.5vh),90px)!important;line-height:1!important}
#app .card i:not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______){font-weight:700!important}
#app :is(.txt b,.tile span,.tab span,.hdrTitle,.btn,.tag):not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______){font-weight:800!important;letter-spacing:.8px!important}

/* cards: apenas pesos 600 (títulos) e 400 (descrições) */
#app :is(.item,.tile,.tab,.tag,.pcard,.lang,.msg,.btn,.badge,.soon) :is(b,span,strong,h1,h2):not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______):not(#_______),
#app :is(.tag,.btn,.lang,.badge):not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______):not(#_______){font-weight:600!important}
#app :is(.item,.tile,.tab,.tag,.pcard,.lang,.msg,.btn,.badge,.soon) :is(small,p):not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______):not(#_______),#app .msg:not(#_):not(#__):not(#___):not(#____):not(#_____):not(#______):not(#_______){font-weight:400!important}

/* rodapé: 10px peso 400 */
#app .tab span:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_),#app .tab:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){font-size:10px!important;font-weight:400!important;letter-spacing:.4px!important}

/* ===== HEROES premium: fundo mais escuro + 2 cartas laranja escuro ===== */
#app,#splash{background:
  radial-gradient(ellipse 120% 55% at 50% 0%,rgba(150,62,14,.55) 0%,rgba(150,62,14,0) 70%),
  radial-gradient(ellipse 110% 45% at 50% 100%,rgba(90,38,10,.45) 0%,rgba(90,38,10,0) 70%),
  linear-gradient(180deg,#4A1E06 0%,#010000 50%,#24100A 80%,#1C0C05 100%)!important}
#welcome::after,#splash::after{background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 60%,rgba(0,0,0,.6) 100%)!important}
.cards .card.c1:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_),.cards .card.c4:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){display:none!important}
.cards .card.c2:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){transform:rotate(-4deg) translateX(0)!important}
.cards .card.c3:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){transform:rotate(8deg) translateX(10%)!important}
.cards .card:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){opacity:.62!important;
  background:
   linear-gradient(115deg,rgba(255,200,150,.10) 0%,rgba(255,200,150,0) 28%,rgba(255,200,150,0) 70%,rgba(255,170,110,.06) 100%),
   linear-gradient(160deg,#3A1A08 0%,#1E0C04 48%,#0C0502 100%)!important;
  border:1px solid rgba(214,120,55,.55)!important;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.35),inset 0 0 0 5px rgba(214,120,55,.22),inset 0 1px 0 rgba(255,210,170,.18),0 20px 50px rgba(0,0,0,.75),0 0 30px rgba(180,80,20,.12)!important;
  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  color:#B8642A!important;text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 10px rgba(214,120,55,.18)!important}
.cards .card.rd:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){color:#C9733A!important}
.cards .card b:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){opacity:.35!important}
.cards.dim:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){opacity:.75!important}

/* padrão real de carta: índice no canto superior esquerdo e repetido invertido no inferior direito */
#app .card i.r:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){left:auto!important;right:6%!important;top:auto!important;bottom:4%!important;transform:rotate(180deg)!important}
#app .card i:not(.r):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){left:7%!important;top:4%!important}
#app .cards .card.c2:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){z-index:1}#app .cards .card.c3:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){z-index:2}
#app .cards .card:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){box-shadow:inset 0 0 0 4px rgba(0,0,0,.35),inset 0 0 0 5px rgba(214,120,55,.22),inset 0 1px 0 rgba(255,210,170,.18),-14px 0 34px rgba(0,0,0,.7),0 0 30px rgba(180,80,20,.12)!important}

#app .cards .card:not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_):not(#_){--w:min(108vw,51vh,450px)!important;top:calc(91% - var(--w)*1.4)!important;left:68%!important}

 const f=n.querySelector("input");if(f&&id!=="otp")setTimeout(()=>f.focus(),380);}
function go(id){stack.push(id);H.push({id});show(id,1)}
function back(){if(stack.length>1){history.back()}}

window.addEventListener("popstate",()=>{if(stack.length>1){stack.pop();show(stack[stack.length-1],-1)}});

function clearMsg(){clearTimeout(tt);document.querySelectorAll(".msg").forEach(x=>x.remove())}

  setTimeout(()=>{v.style.opacity="";slideDir=dx<0?1:-1;setView(TABS[to])},170);drag=null});
})();
function renderHome(){const s=store.get("heroes.session");if(!s)return;$("#hello").textContent=t("hi2")+" "+s.name;renderView()}

// quick access (biometria simulada; no app nativo usar plugin de biometria)
$("#bioBtn").onclick=async()=>{const b=$("#bioBtn");if(b.classList.contains("on"))return;b.classList.add("on");$("#bioTxt").textContent=t("bScan");
 await wait(1400);b.classList.remove("on");b.classList.add("ok");$("#bioTxt").textContent=t("bOk");if(navigator.vibrate)navigator.vibrate(40);
 await wait(600);b.classList.remove("ok");$("#bioTxt").textContent=t("bTap");login(t("bName"),"quick")};

// whatsapp
const phone=$("#phone");
phone.addEventListener("input",()=>{let d=phone.value.replace(/\D/g,"").slice(0,11);
 if($("#ddi").value==="55"){d=d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
 phone.value=d;$("#wErr").textContent=""});
let otpCode="",timer;
async function sendCode(){otpCode=String(Math.floor(100000+Math.random()*900000));await wait(900);setTimeout(()=>{if($("#otp").classList.contains("on"))toast(t("demo")+" "+otpCode,0)},450);startTimer()}
function startTimer(){let s=30;clearInterval(timer);const r=$("#resend");const tick=()=>{if(s<=0){clearInterval(timer);r.innerHTML=`<button id="rs">${t("resend")}</button>`;$("#rs").onclick=()=>{r.innerHTML='<span class="spin"></span>';sendCode()}}else r.textContent=`${t("resendIn")} 0:${String(s).padStart(2,"0")}`;s--};tick();timer=setInterval(tick,1000)}
$("#wBtn").onclick=async()=>{const d=phone.value.replace(/\D/g,"");const min=$("#ddi").value==="55"?10:7;
 if(d.length<min){$("#wErr").textContent=t("phoneErr");return}
 busy($("#wBtn"),1);$("#otpPhone").textContent=`+${$("#ddi").value} ${phone.value}`;await sendCode();busy($("#wBtn"),0);buildOtp();go("otp");setTimeout(()=>$("#otpBox input").focus(),400)};
function buildOtp(){const b=$("#otpBox");b.innerHTML=Array(6).fill('<input inputmode="numeric" autocomplete="one-time-code">').join("");$("#oErr").textContent="";$("#oBtn").disabled=true;
 const ins=[...b.children];const code=()=>ins.map(i=>i.value).join("");
 ins.forEach((inp,i)=>{inp.addEventListener("input",()=>{const v=inp.value.replace(/\D/g,"");
   if(v.length>1){v.slice(0,6).split("").forEach((c,j)=>ins[j]&&(ins[j].value=c));ins[Math.min(v.length,5)].focus()}else{inp.value=v;if(v&&ins[i+1])ins[i+1].focus()}
   $("#oErr").textContent="";$("#oBtn").disabled=code().length<6;if(code().length===6)$("#oBtn").click()});
  inp.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!inp.value&&ins[i-1])ins[i-1].focus()})});}
$("#oBtn").onclick=async()=>{const ins=[...$("#otpBox").children];const c=ins.map(i=>i.value).join("");if(c.length<6)return;
 busy($("#oBtn"),1);await wait(700);busy($("#oBtn"),0);
 if(c!==otpCode){$("#oErr").textContent=t("codeErr");ins.forEach(i=>i.value="");ins[0].focus();$("#oBtn").disabled=true;if(navigator.vibrate)navigator.vibrate(120);return}
 clearInterval(timer);login("+"+$("#ddi").value+" •••• "+phone.value.replace(/\D/g,"").slice(-4),"whats")};


// google (simulado; no app real usar Google Sign-In / OAuth)
$("#gBtn").onclick=async()=>{const e=$("#gmail").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$("#gErr").textContent=t("emailErr");return}
 $("#gErr").textContent="";busy($("#gBtn"),1);await wait(900);busy($("#gBtn"),0);login(e.split("@")[0],"google")};
$("#gmail").addEventListener("keydown",e=>e.key==="Enter"&&$("#gBtn").click());
// stackup id
$("#eye").onclick=()=>{const p=$("#pass");const s=p.type==="password";p.type=s?"text":"password";$("#eye").textContent=t(s?"hide":"show")};
$("#forgot").onclick=()=>{const e=$("#email").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$("#sErr").textContent=t("emailErr");return}$("#sErr").textContent="";toast(t("forgotMsg"))};
$("#sBtn").onclick=async()=>{const e=$("#email").value.trim(),p=$("#pass").value;
 if(!/^\S+@\S+\.\S+$/.test(e)){$("#sErr").textContent=t("emailErr");return}if(p.length<6){$("#sErr").textContent=t("passErr");return}
 $("#sErr").textContent="";busy($("#sBtn"),1);await wait(900);busy($("#sBtn"),0);login(e.split("@")[0],"sid")};
$("#pass").addEventListener("keydown",e=>e.key==="Enter"&&$("#sBtn").click());

// boot
applyLang();H.rep({id:"welcome"});
setTimeout(()=>{const s=store.get("heroes.session");const first=s?"home":"welcome";stack=[first];
 const si=$("#splash .spIn");si.style.transition="opacity .35s ease,transform .35s ease";si.style.opacity=0;si.style.transform="scale(.94)";setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").classList.remove("on"),500);$("#"+first).classList.add("on")},320)},2300);
</script>
