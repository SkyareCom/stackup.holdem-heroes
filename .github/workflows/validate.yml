name: Validate Heroes

on:
  push:
    branches:
      - main
      - work/heroes-playstore-foundation
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: npm test
      - name: Build web artifact
        run: npm run build
